name: test
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"   # the supported baseline; also run a newer version via the matrix below if desired
          terraform_wrapper: false
      - run: make verify
      - run: make mutation
